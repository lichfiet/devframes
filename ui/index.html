<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>devframes</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <header class="side-head">
        <button class="icon-btn" id="collapse" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="brand">
          <strong>devframes</strong>
          <span id="repo" class="muted"></span>
        </div>
      </header>
      <ul class="sessions" id="sessions" aria-label="Sessions"></ul>
      <section class="combine" id="combine">
        <div class="combine-head"><strong>Combine</strong><span class="muted"> unmerged branches</span></div>
        <ul id="combineList"></ul>
        <div class="combine-actions">
          <button class="btn" id="combineBuild">Build preview</button>
          <button class="btn" id="combineRebuild" title="Re-run with the saved selection">Rebuild</button>
        </div>
        <div id="combineResult" class="combine-result"></div>
      </section>
      <ul class="links" id="links"></ul>
      <footer class="side-foot">
        <div id="summary" class="muted"></div>
        <button class="btn danger" id="stopAll">Stop all</button>
      </footer>
    </aside>

    <main class="main">
      <div class="toolbar" id="toolbar">
        <div class="tb-info" id="tbInfo" title="Active session"></div>
        <div class="tb-mid">
          <form id="pathForm" class="path" role="search" autocomplete="off">
            <input id="path" spellcheck="false" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="routeMenu" aria-label="Search routes or type a path" placeholder="Search routes or type a path" />
            <button type="button" class="icon-btn" id="quickBtn" title="Quick routes" aria-label="Quick routes" aria-haspopup="listbox">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <ul id="routeMenu" class="menu" role="listbox" hidden></ul>
          </form>
          <div id="quick" class="quick"></div>
        </div>
        <button class="btn" id="changesBtn" title="What changed in this session: commits and uncommitted files">Changes</button>
        <div class="tb-right">
          <div class="seg" id="viewModes" role="group" aria-label="Viewports (toggle any combination)"></div>
          <button class="icon-btn" id="settingsBtn" title="Settings (,)" aria-label="Settings" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <button class="icon-btn" id="reload" title="Reload active session's frames" aria-label="Reload">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <a class="icon-btn" id="openTab" target="_blank" rel="noreferrer" title="Open in a new tab" aria-label="Open in a new tab">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
      </div>
      <aside class="changes" id="changes" hidden aria-label="Changes">
        <header class="changes-head">
          <strong id="changesTitle">Changes</strong>
          <button class="icon-btn" id="changesClose" title="Close" aria-label="Close changes">✕</button>
        </header>
        <div id="changesBody" class="changes-body"></div>
      </aside>
      <div class="stage" id="stage">
        <div class="empty" id="empty">Pick a session on the left, or press <kbd>[</kbd> / <kbd>]</kbd>.</div>
      </div>
    </main>
  </div>
  <div class="modal-back" id="settings" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="changes-head">
        <strong id="settingsTitle">Settings</strong>
        <button class="icon-btn" id="settingsClose" title="Close (Esc)" aria-label="Close settings">✕</button>
      </header>
      <div class="modal-body" id="settingsBody"></div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
